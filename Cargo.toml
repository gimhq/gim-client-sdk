[workspace]
resolver = "2"
members = [
    "crates/gim-store-sqlite",
    "crates/gim-sdk",
    "crates/gim-ui",
    "bindings/gim-ffi",
    "apps/gim-cli",
    "uniffi-bindgen",
    "testing/gim-integration-testing",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Protocol crates of gim-core, pinned by commit. For local work on both
# repositories, override with `[patch."https://github.com/gimhq/gim-core.git"]`.
gim-base = { git = "https://github.com/gimhq/gim-core.git", rev = "d2a58f853366e772668794ad7b16d0d309ee534b" }
gim-common = { git = "https://github.com/gimhq/gim-core.git", rev = "d2a58f853366e772668794ad7b16d0d309ee534b" }
gim-crypto = { git = "https://github.com/gimhq/gim-core.git", rev = "d2a58f853366e772668794ad7b16d0d309ee534b" }
gim-identity = { git = "https://github.com/gimhq/gim-core.git", rev = "d2a58f853366e772668794ad7b16d0d309ee534b" }
gim-proto = { git = "https://github.com/gimhq/gim-core.git", rev = "d2a58f853366e772668794ad7b16d0d309ee534b" }
gim-test = { git = "https://github.com/gimhq/gim-core.git", rev = "d2a58f853366e772668794ad7b16d0d309ee534b" }

gim-store-sqlite = { path = "crates/gim-store-sqlite" }
gim-sdk = { path = "crates/gim-sdk" }
gim-ui = { path = "crates/gim-ui" }

async-trait = "=0.1.92"
axum = { version = "=0.8.9", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
    "ws",
] }
base64 = "=0.22.1"
ciborium = "=0.2.2"
clap = { version = "=4.6.7", features = ["derive", "env"] }
eyeball = "=0.8.8"
eyeball-im = "=0.9.1"
futures-core = "=0.3.34"
futures-util = "=0.3.34"
getrandom = "=0.2.17"
openmls_sqlite_storage = "=0.3.0"
# rustls with the ring provider and webpki roots: no aws-lc/cmake/OpenSSL in
# Android/iOS cross-compiles.
reqwest = { version = "=0.12.28", default-features = false, features = [
    "json",
    "rustls-tls-webpki-roots",
    "stream",
] }
# Same TLS stack as reqwest for the WebSocket stream: ring provider, webpki
# roots.
rustls = { version = "=0.23.46", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
# SQLCipher with a vendored, statically linked OpenSSL (libcrypto) on every
# target, including Apple (see bindings/apple/README.md).
rusqlite = { version = "=0.37.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_bytes = "=0.11.19"
serde_json = "=1.0.154"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = "=1.53.1"
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
tokio-util = { version = "=0.7.18", default-features = false, features = ["io"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
uniffi = "=0.32.2"
url = "=2.5.8"
webpki-roots = "=1.0.9"
wiremock = "=0.6.5"
zeroize = { version = "=1.9.1", features = ["derive"] }

# Recovery backups run Argon2id with 64 MiB; unoptimized it dominates
# debug test runs.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

# Static libraries of GIMCore.xcframework (bindings/apple/build-xcframework.sh).
# opt-level "s" measured slightly smaller than "z" and ~20% smaller than 3 once
# stripped; panic stays "unwind" for UniFFI. `strip` has no effect on
# staticlibs (no link step), so the script strips the .a files.
[profile.release-apple]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = false
